name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check changed React code
        if: github.event_name == 'pull_request'
        env:
          DOCTOR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run doctor --verbose --scope changed --base "$DOCTOR_BASE" --blocking warning
      - name: Check the merge queue
        if: github.event_name == 'merge_group'
        run: bun run doctor --verbose --scope full --blocking warning

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint source
        run: bun run lint
      - name: Check types
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Build shared packages
        run: bun run --filter @repo/domain --filter @repo/design-system build
      - name: Build static application
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
        run: bun run --filter www build
      - name: Install browser for acceptance tests
        working-directory: apps/www
        run: bunx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: bun run --filter www test:e2e
